'use strict';
(() => {
const $=s=>document.querySelector(s), main=$('#main'),dialog=$('#dialog'),body=$('#dialog-content');
const listened=new WeakSet();
const KEY='versa-prototype-v1';let wallet=null,provider=null,quizTimer=null,activeQuiz=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let state={challenges:[],quizResults:[],profile:{name:'Player',referral:'VERSA-'+Math.random().toString(36).slice(2,7).toUpperCase()}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.challenges)&&Array.isArray(saved.quizResults)&&saved.profile)state=saved;}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{toast('Could not save on this device.');return false;}}
function toast(message){const node=$('#toast');node.textContent=message;node.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.hidden=true,4000);}
function modal(title,content){body.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${escape(title)}</h2><button class="close" data-close aria-label="Close">×</button></div>${content}`;if(!dialog.open)dialog.showModal();}
function close(){if(dialog.open)dialog.close();}
function phantom(){return window.phantom?.solana?.isPhantom?window.phantom.solana:(window.solana?.isPhantom?window.solana:null);}
function shortened(key){return key.slice(0,4)+'…'+key.slice(-4);}
function syncWallet(){document.querySelectorAll('[data-wallet]').forEach(button=>{button.classList.toggle('connected',!!wallet);button.innerHTML=wallet?`${escape(shortened(wallet))} <span>⌄</span>`:'Connect wallet <span>↗</span>';});}
async function connectWallet(){
 const p=phantom();if(!p){modal('Connect wallet',`<p class="small">This prototype uses Phantom. On mobile, open <strong>playversa.fun</strong> in Phantom’s in-app browser. On desktop, install or unlock the Phantom extension and return here.</p><a class="btn" href="https://phantom.com/" target="_blank" rel="noopener noreferrer">Get Phantom ↗</a><p class="small">Connecting shares your public address. No transaction or signature is requested.</p>`);return;}
 try{const response=await p.connect();if(!response?.publicKey)throw Error('No wallet address returned.');provider=p;wallet=response.publicKey.toString();syncWallet();close();toast('Wallet connected.');if(location.hash==='#profile')render();
 if(!listened.has(p)){p.on?.('disconnect',()=>{wallet=null;syncWallet();if(location.hash==='#profile')render();toast('Wallet disconnected.');});p.on?.('accountChanged',key=>{wallet=key?key.toString():null;syncWallet();if(location.hash==='#profile')render();});listened.add(p);}}
 catch(error){toast(error?.message||'Wallet connection cancelled.');}
}
function walletDialog(){if(!wallet){modal('Get started',`<p class="small">Connect a Solana wallet to explore your Versa profile.</p><div class="choices"><button class="choice" data-connect>Connect Phantom <span>Solana wallet ↗</span></button><button class="choice" disabled>Continue with X <span>Coming later</span></button></div><div class="info-box">Connecting displays your public address. This prototype does not request a signature or transfer funds.</div>`);return;}
 modal('Connected wallet',`<p class="small">Phantom · Solana</p><p class="wallet-address">${escape(wallet)}</p><div class="actions"><button class="btn ghost" data-copy-wallet>Copy address</button><button class="btn outline" data-disconnect>Disconnect</button></div>`);}
const samples=[{id:'sample-fc',title:'Friday Night Football',game:'EA SPORTS FC',category:'Gaming',mode:'Head-to-head',prize:'Demo event',host:'VERSA',description:'Example head-to-head challenge. Choose your platform and agree on the rules.'},{id:'sample-race',title:'Street Racing Duel',game:'Racing',category:'Gaming',mode:'Head-to-head',prize:'Demo event',host:'PLAYER',description:'An example driving challenge between two players.'},{id:'sample-quiz',title:'Crypto Knowledge Quiz',game:'Crypto Quiz',category:'Quiz',mode:'Quiz',prize:'Demo event',host:'VERSA',description:'Test your knowledge in a short timed sample quiz.'}];
const quizData={Crypto:[{q:'What does a Solana wallet public address let someone do?',a:['Send assets to the wallet','Access the wallet’s private key','Change the wallet owner’s password','Reverse every transaction'],correct:0},{q:'What should you do with a wallet recovery phrase?',a:['Post it for account verification','Keep it private and backed up securely','Send it to tournament moderators','Put it on your public profile'],correct:1},{q:'What is a blockchain transaction?',a:['A record submitted to the network','A guarantee of profit','A browser cookie','A private chat message'],correct:0}],History:[{q:'Which ancient civilisation built the pyramids at Giza?',a:['Ancient Egypt','Ancient Rome','Maya','Ancient Greece'],correct:0},{q:'Which invention is Johannes Gutenberg associated with in Europe?',a:['The printing press','The telephone','The steam locomotive','The electric battery'],correct:0},{q:'Which city was the capital of the Byzantine Empire?',a:['Carthage','Constantinople','Athens','Alexandria'],correct:1}],General:[{q:'Which planet is known as the Red Planet?',a:['Venus','Mars','Jupiter','Mercury'],correct:1},{q:'How many sides does a hexagon have?',a:['Five','Six','Seven','Eight'],correct:1},{q:'Which ocean is the largest?',a:['Atlantic','Arctic','Pacific','Indian'],correct:2}]};
function card(c,example=true){return `<article class="card"><div class="card-body"><div class="card-top"><span>${escape(c.category).toUpperCase()} / ${escape(c.game)}</span><span class="pill">${example?'SAMPLE':'SAVED LOCALLY'}</span></div><h3>${escape(c.title)}</h3><p>${escape(c.description||c.rules||'A match set up in this browser.')}</p><div class="card-prize">${escape(c.prize||'Practice')} <small>${example?'illustrative':'prototype'}</small></div><div class="card-foot"><span>${escape(c.mode||'Head-to-head')} · ${escape(c.host||'YOU')}</span><button data-open-match="${escape(c.id)}">View details ↗</button></div></div></article>`;}
function home(){return `<section class="hero"><picture><source media="(max-width:600px)" srcset="versa-hero-mobile.png"><img class="hero-bg" src="versa-hero-desktop.png" alt=""></picture><div class="hero-inner"><p class="eyebrow"><span class="dot"></span> THE ARENA IS TAKING SHAPE</p><h1 class="display">YOUR GAME.<br><em>YOUR RIVAL.</em><br>YOUR MOMENT.</h1><p>Challenge other players, join competitions, and put your knowledge to the test—all in one place.</p><div class="actions"><a href="#competitions" class="btn">Explore competitions ↗</a><a href="#quiz" class="btn outline">Try a quiz ↗</a></div><div class="hero-hint"><span>Gaming & quizzes</span><span>Solana wallet ready</span><span>Demo experience</span></div></div></section><div class="ticker"><div class="wrap"><span>CHALLENGE <b>01</b></span><span>COMPETE <b>02</b></span><span>SUBMIT RESULTS <b>03</b></span><span>REVIEW <b>04</b></span></div></div><section class="section"><div class="wrap"><div class="section-head"><div><p class="eyebrow">FIND YOUR NEXT MATCH</p><h2 class="section-title">PICK YOUR ARENA.</h2></div><a class="text-link" href="#competitions">Explore all competitions ↗</a></div><div class="card-grid">${samples.map(x=>card(x)).join('')}</div></div></section><section class="section section-alt"><div class="wrap"><div class="section-head"><div><p class="eyebrow">HOW VERSA WORKS</p><h2 class="section-title">FROM CHALLENGE<br>TO RESULT.</h2></div><p>Versa brings match details, players, and evidence together in one place. Here’s the proposed flow.</p></div><div class="step-grid"><div class="step"><span class="step-num">01</span><h3>Set the challenge</h3><p>Choose your game, opponent, and the rules you both agree to.</p></div><div class="step"><span class="step-num">02</span><h3>Get ready</h3><p>Confirm the match details and play together in your chosen game.</p></div><div class="step"><span class="step-num">03</span><h3>Submit evidence</h3><p>Players submit results and recordings for an administrator to review.</p></div><div class="step"><span class="step-num">04</span><h3>Review & settle</h3><p>The administrator reviews the result and authorises settlement.</p></div></div><p class="small">Escrow and settlement are proposed features and aren’t active in this prototype.</p></div></section><section class="section"><div class="wrap"><div class="section-head"><div><p class="eyebrow">MORE THAN ONE WAY TO PLAY</p><h2 class="section-title">CHOOSE YOUR CHALLENGE.</h2></div></div><div class="feature-grid"><article class="feature"><img src="versa-game-genres.png" alt="Illustrations of sports, driving and fighting games" loading="lazy"><div class="feature-copy"><p class="eyebrow">GAMING ARENA</p><h3>Find a rival.</h3><p>Invite players and plan competitions around games you enjoy.</p><a class="text-link" href="#competitions">Explore matches ↗</a></div></article><article class="feature"><img src="versa-escrow.png" alt="Illustration of a locked match vault" loading="lazy"><div class="feature-copy"><p class="eyebrow">QUIZ ARENA</p><h3>Know your stuff?</h3><p>Try timed questions in crypto, history, and general knowledge.</p><a class="text-link" href="#quiz">Try a quiz ↗</a></div></article></div></div></section><section class="section section-alt"><div class="wrap"><div class="two-col"><div><p class="eyebrow">MADE FOR RIVALS</p><h2 class="section-title">PLAY TOGETHER.<br>COME BACK STRONGER.</h2><p class="page-intro">Create your player profile, track your quiz results, and invite your friends. This first version is a local prototype.</p><a class="btn outline" href="#profile">View profile ↗</a></div><img class="image-panel" src="versa-remote-players.png" alt="Two gamers playing remotely" loading="lazy"></div></div></section><section class="section controller-section"><div class="wrap controller-panel"><div><p class="eyebrow">BRING YOUR GAME</p><h2 class="section-title">PICK UP.<br>PLAY ON.</h2><p class="page-intro">A place for your next rival, your next challenge, and your next win.</p><a class="btn" href="#competitions">Find your arena ↗</a></div><img src="game-pads.png" alt="Two lime green gaming controllers" loading="lazy"></div></section><section class="section"><div class="wrap"><div class="bottom-cta"><div><h2>READY FOR YOUR NEXT MATCH?</h2><p>Explore the Versa prototype and tell us what you think.</p></div><a href="#competitions" class="btn">Enter the arena ↗</a></div></div></section>`;}
function competitionList(){return [...state.challenges].reverse().map(c=>card({...c,category:'Gaming',mode:'Head-to-head',host:'YOU',prize:'Practice'},false)).join('')+samples.map(c=>card(c)).join('');}
function competitions(){return `<section class="wrap page-top"><p class="eyebrow">YOUR ARENA</p><h1 class="page-title">FIND YOUR<br><span style="color:var(--lime)">NEXT MATCH.</span></h1><p class="page-intro">Explore sample competitions or create a practice challenge in this browser.</p><div class="inline-note">These listings are examples or local practice challenges. They are not live opponents or paid competitions.</div><div class="filters"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Gaming">Gaming</button><button class="filter" data-filter="Quiz">Quiz</button><input class="filter-search" type="search" placeholder="Search challenges" aria-label="Search challenges"><button class="btn" data-create>Create challenge +</button></div><div class="card-grid" id="matches">${competitionList()}</div><div class="section"><p class="eyebrow">HOSTED BY VERSA</p><h2 class="section-title">COMPETE FOR MORE.</h2><p class="page-intro">Versa-hosted competitions and token-holder eligibility are planned. They are not active in this prototype.</p></div></section>`;}
function quizHome(){return `<section class="wrap page-top bottom"><p class="eyebrow">QUIZ ARENA / PRACTICE MODE</p><h1 class="page-title">THINK FAST.<br><span style="color:var(--lime)">PLAY SMART.</span></h1><p class="page-intro">Choose a category and test your knowledge. You get 30 seconds per question.</p><div class="inline-note">Practice quiz · 3 questions · Timer runs in your browser · No prize or opponent</div><div class="card-grid">${[['Crypto','Wallets, blockchain and security'],['History','People, places and events'],['General','A little bit of everything']].map(([n,d])=>`<article class="card"><div class="card-body"><div class="card-top"><span>QUIZ / PRACTICE</span><span class="pill">3 QUESTIONS</span></div><h3>${n} Quiz</h3><p>${d}.</p><div class="card-prize">30 <small>seconds per question</small></div><div class="card-foot"><span>Free practice</span><button data-start-quiz="${n}">Start quiz ↗</button></div></div></article>`).join('')}</div><div class="section"><div class="bottom-cta"><div><h2>READY FOR A REAL RIVAL?</h2><p>Player-versus-player quizzes are part of the planned product.</p></div><a class="btn" href="#competitions">Explore competitions ↗</a></div></div></section>`;}
function profile(){const score=state.quizResults.length, best=state.quizResults.length?Math.max(...state.quizResults.map(x=>x.score)):0;return `<section class="wrap page-top"><p class="eyebrow">PLAYER PROFILE / LOCAL DEMO</p><h1 class="page-title">YOUR VERSA.</h1><p class="page-intro">Your player details and practice activity, saved on this device.</p><div class="inline-note">Profile data is local to this browser and is not a verified account. Wallet connection does not sign you in.</div><div class="two-col"><div><div class="panel"><div class="card-top"><span class="pill">${wallet?'WALLET CONNECTED':'GUEST PROFILE'}</span><button class="filter" data-edit-profile>Edit name</button></div><div style="margin:24px 0"><span class="avatar">${escape((state.profile.name||'P').slice(0,1).toUpperCase())}</span><strong>${escape(state.profile.name||'Player')}</strong></div><p>${wallet?'Connected: '+escape(shortened(wallet)):'Connect Phantom to display your wallet address.'}</p><div class="actions"><button class="btn" data-wallet>${wallet?'Wallet options ↗':'Connect wallet ↗'}</button><button class="btn outline" data-invite>Invite a friend ↗</button></div></div><div class="panel"><h2>Practice activity</h2>${state.quizResults.length?`<table class="table"><thead><tr><th>Category</th><th>Result</th><th>Date</th></tr></thead><tbody>${state.quizResults.slice(-8).reverse().map(x=>`<tr><td>${escape(x.category)}</td><td>${escape(x.score)} / ${escape(x.total)}</td><td>${escape(new Date(x.when).toLocaleDateString())}</td></tr>`).join('')}</tbody></table>`:'<p>Try a quiz and your practice results will appear here.</p><a class="text-link" href="#quiz">Go to Quiz Arena ↗</a>'}</div></div><aside><div class="metric-grid"><div class="metric"><strong>${score}</strong><small>Quizzes played</small></div><div class="metric"><strong>${best}/3</strong><small>Best quiz score</small></div><div class="metric"><strong>—</strong><small>Match wins</small></div><div class="metric"><strong>—</strong><small>Prize earnings</small></div></div><div class="panel" style="margin-top:18px"><h2>Your invite code</h2><p class="wallet-address">${escape(state.profile.referral)}</p><p>Referral tracking is planned. This prototype can copy a sample invite code, but cannot register referrals.</p><button class="btn ghost" data-copy-ref>Copy code ↗</button></div></aside></div></section>`;}
function how(){return `<section class="wrap page-top"><p class="eyebrow">THE VERSA PLAYBOOK</p><h1 class="page-title">AGREE. COMPETE.<br><span style="color:var(--lime)">SETTLE.</span></h1><p class="page-intro">Versa is being designed to bring online gamers and quiz lovers together. Here’s how the proposed match experience fits together.</p><div class="inline-note">This is a prototype. Wallet connection is available; match invitations, escrow, evidence upload and payouts are not live.</div><div class="step-grid section">${[['01','Find your match','Select a game or quiz and invite an opponent.'],['02','Agree on rules','Confirm the game, platform, schedule, and result requirements.'],['03','Play and submit','Compete and submit the result with supporting evidence.'],['04','Review and settle','An administrator reviews the evidence before authorising a result.']].map(([n,t,d])=>`<div class="step"><span class="step-num">${n}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="feature-grid"><article class="feature"><img src="versa-escrow.png" alt="Illustrative escrow vault"><div class="feature-copy"><p class="eyebrow">PLANNED / ESCROW</p><h3>Designed around clear rules.</h3><p>Players will see the match details and proposed settlement process before agreeing.</p></div></article><article class="feature"><img src="versa-payout.png" alt="Illustrative payout options"><div class="feature-copy"><p class="eyebrow">PLANNED / REWARDS</p><h3>Know the outcome.</h3><p>Future competitions may use SOL or Versa tokens depending on the event.</p></div></article></div><div class="two-col section"><img class="image-panel" src="versa-video-review.png" alt="Concept illustration of reviewing player match recordings" loading="lazy"><div><p class="eyebrow">PLANNED / RESULT REVIEW</p><h2 class="section-title">THE RESULT.<br>BACKED BY EVIDENCE.</h2><p class="page-intro">Both players submit their result and match recordings for administrator review. Evidence uploads and disputes will be available in a future version.</p></div></div><div class="section"><h2 class="section-title">QUESTIONS, ANSWERED.</h2><div class="panel" style="margin-top:20px"><h2>Can I play a real match here?</h2><p>The games are played separately on their own platforms. This prototype only demonstrates how challenges could be organised.</p><h2>Can I deposit or receive funds?</h2><p>No. Connecting Phantom only shares your public wallet address. This prototype does not transfer funds.</p><h2>What about X sign-in?</h2><p>It’s planned for the full product and is not available in this prototype.</p></div></div></section>`;}
function route(){return (location.hash.slice(1).split('?')[0]||'home');}
function render(){if(quizTimer){clearInterval(quizTimer);quizTimer=null;}activeQuiz=null;const page=route();main.innerHTML=page==='competitions'?competitions():page==='quiz'?quizHome():page==='profile'?profile():page==='how'?how():home();document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});syncWallet();$('#nav').classList.remove('open');$('.menu-btn').setAttribute('aria-expanded','false');window.scrollTo(0,0);}
function createDialog(){modal('Create a practice challenge',`<p class="small">Saved only in this browser. No invitation or funds are sent.</p><form class="form" id="create-form"><label>Challenge title<input name="title" required maxlength="80" placeholder="e.g. Friday night football"></label><label>Game<select name="game"><option>EA SPORTS FC</option><option>Racing</option><option>Fighting</option><option>Chess</option><option>Other</option></select></label><label>Opponent username<input name="opponent" required maxlength="30" placeholder="Their username"></label><label>Match rules<textarea name="rules" required maxlength="1500" placeholder="Game mode, platform and winning condition"></textarea></label><div class="error" role="alert"></div><button class="btn" type="submit">Save practice challenge ↗</button></form>`);}
function matchDialog(id){const c=samples.find(x=>x.id===id)||state.challenges.find(x=>x.id===id);if(!c){toast('Challenge not found on this device.');return;}const isSample=id.startsWith('sample-');modal(c.title,`<p class="eyebrow">${isSample?'SAMPLE COMPETITION':'YOUR LOCAL PRACTICE CHALLENGE'}</p><p>${escape(c.description||c.rules||'')}</p><div class="panel"><div class="detail-row"><span class="muted">Game</span><strong>${escape(c.game)}</strong></div><div class="detail-row"><span class="muted">Format</span><strong>Head-to-head</strong></div><div class="detail-row"><span class="muted">Opponent</span><strong>${escape(c.opponent||'Sample player')}</strong></div></div><div class="info-box">${isSample?'This example does not represent a live match.':'This challenge is saved on this device only. Invitations and evidence uploads are not connected yet.'}</div><div class="actions">${id==='sample-quiz'?'<button class="btn" data-start-quiz="Crypto">Try the quiz ↗</button>':'<button class="btn ghost" disabled>Invite & play · Coming later</button>'}${!isSample?`<button class="btn outline" data-delete="${escape(id)}">Remove practice challenge</button>`:''}</div>`);}
function showQuestion(){const q=activeQuiz.questions[activeQuiz.index];main.innerHTML=`<section class="wrap page-top"><div class="quiz-card"><p class="eyebrow">${escape(activeQuiz.category)} QUIZ / PRACTICE</p><div class="card-meta"><span class="muted">Question ${activeQuiz.index+1} of ${activeQuiz.questions.length}</span><span class="timer" id="timer">30s</span></div><div class="progress"><div id="progress" style="width:100%"></div></div><div class="panel" style="margin-top:24px"><h1 class="quiz-question">${escape(q.q)}</h1><div class="answers">${q.a.map((a,i)=>`<button class="answer" data-answer="${i}">${String.fromCharCode(65+i)} &nbsp; ${escape(a)}</button>`).join('')}</div></div><button class="filter" data-end-quiz>Leave quiz</button><p class="small">Browser-timed practice: closing or switching tabs is not enforced.</p></div></section>`;activeQuiz.deadline=Date.now()+30000;quizTimer=setInterval(()=>{const remain=Math.max(0,activeQuiz.deadline-Date.now());const t=$('#timer'),p=$('#progress');if(t)t.textContent=Math.ceil(remain/1000)+'s';if(p)p.style.width=(remain/300)+'%';if(remain<=0)answer(-1);},150);window.scrollTo(0,0);}
function startQuiz(category){if(!quizData[category])return;close();clearInterval(quizTimer);activeQuiz={category,questions:quizData[category],index:0,score:0,deadline:0};showQuestion();}
function answer(index){if(!activeQuiz)return;clearInterval(quizTimer);quizTimer=null;const q=activeQuiz.questions[activeQuiz.index];if(Date.now()<=activeQuiz.deadline&&index===q.correct)activeQuiz.score++;activeQuiz.index++;if(activeQuiz.index<activeQuiz.questions.length){showQuestion();return;}const result={category:activeQuiz.category,score:activeQuiz.score,total:activeQuiz.questions.length,when:new Date().toISOString()};state.quizResults.push(result);save();activeQuiz=null;main.innerHTML=`<section class="wrap page-top"><div class="quiz-card"><p class="eyebrow">PRACTICE COMPLETE</p><h1 class="page-title">NICE WORK.</h1><div class="panel"><p class="muted">${escape(result.category)} Quiz</p><div class="card-prize">${result.score} / ${result.total} <small>correct answers</small></div><p>Your practice result is saved on this device.</p><div class="actions"><button class="btn" data-start-quiz="${escape(result.category)}">Play again ↗</button><a class="btn outline" href="#profile">View profile ↗</a><a class="btn ghost" href="#quiz">More quizzes</a></div></div></div></section>`;}
document.addEventListener('click',async event=>{const el=event.target.closest('button,a');if(!el)return;
 if(el.matches('[data-wallet]')){walletDialog();return;}if(el.matches('[data-connect]')){await connectWallet();return;}if(el.matches('[data-close]')){close();return;}
 if(el.matches('[data-disconnect]')){try{await provider?.disconnect();wallet=null;syncWallet();close();if(route()==='profile')render();toast('Wallet disconnected.');}catch{toast('Could not disconnect wallet.');}return;}
 if(el.matches('[data-copy-wallet],[data-copy-ref]')){const value=el.matches('[data-copy-wallet]')?wallet:state.profile.referral;try{await navigator.clipboard.writeText(value);toast('Copied.');}catch{toast('Copy unavailable. Select the text manually.');}return;}
 if(el.matches('.menu-btn')){const nav=$('#nav');nav.classList.toggle('open');el.setAttribute('aria-expanded',String(nav.classList.contains('open')));return;}
 if(el.matches('[data-create]')){createDialog();return;}if(el.matches('[data-open-match]')){matchDialog(el.dataset.openMatch);return;}
 if(el.matches('[data-delete]')){state.challenges=state.challenges.filter(x=>x.id!==el.dataset.delete);save();close();render();toast('Practice challenge removed.');return;}
 if(el.matches('[data-filter]')){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===el));filterCards();return;}
 if(el.matches('[data-start-quiz]')){startQuiz(el.dataset.startQuiz);return;}if(el.matches('[data-answer]')){answer(Number(el.dataset.answer));return;}if(el.matches('[data-end-quiz]')){clearInterval(quizTimer);quizTimer=null;activeQuiz=null;render();return;}
 if(el.matches('[data-edit-profile]')){modal('Edit player name',`<form class="form" id="profile-form"><label>Display name<input name="name" required maxlength="30" value="${escape(state.profile.name)}"></label><button class="btn" type="submit">Save name ↗</button></form>`);return;}
 if(el.matches('[data-invite]')){modal('Invite friends',`<p>Share your code with a friend: <strong>${escape(state.profile.referral)}</strong></p><div class="info-box">The referral programme is planned. In this prototype, the code is local and won’t track sign-ups.</div><div class="actions"><button class="btn" data-copy-ref>Copy code ↗</button></div>`);}
});
function filterCards(){const selected=document.querySelector('[data-filter].active')?.dataset.filter||'All',q=($('.filter-search')?.value||'').toLowerCase();document.querySelectorAll('#matches .card').forEach(card=>{const content=card.textContent.toLowerCase();card.hidden=!content.includes(q)||(selected!=='All'&&!content.includes(selected.toLowerCase()));});}
document.addEventListener('input',e=>{if(e.target.matches('.filter-search'))filterCards();});
document.addEventListener('submit',event=>{if(event.target.id==='create-form'){event.preventDefault();const f=new FormData(event.target),title=String(f.get('title')).trim(),opponent=String(f.get('opponent')).trim(),rules=String(f.get('rules')).trim();if(!title||!opponent||!rules){event.target.querySelector('.error').textContent='Complete all fields.';return;}state.challenges.push({id:'local-'+uid(),title,opponent,rules,game:String(f.get('game'))});save();close();render();toast('Practice challenge saved on this device.');}else if(event.target.id==='profile-form'){event.preventDefault();const name=String(new FormData(event.target).get('name')).trim();if(!name)return;state.profile.name=name.slice(0,30);save();close();render();toast('Player name updated.');}});
dialog.addEventListener('click',event=>{if(event.target===dialog)close();});window.addEventListener('hashchange',()=>{close();render();});$('#year').textContent=new Date().getFullYear();render();
})();

</script></body></html>
